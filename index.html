<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="theme-color" content="#0d0a14" />
    <meta name="description" content="Bedtime stories told with your hands, for a child far away." />
    <link rel="icon" href="data:," />
    <title>Shadowplay</title>
    <style>
      /* Shown until the stage is ready (plain HTML and CSS: nothing to download). */
      html, body { margin: 0; background: #0d0a14; }
      #sp-loading {
        position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 22px;
        background: #0d0a14; color: #f6e3bd; font: italic 20px Georgia, 'Times New Roman', serif;
        transition: opacity 0.6s ease;
      }
      #sp-loading.done { opacity: 0; pointer-events: none; }
      #sp-loading .glow {
        width: 140px; height: 140px; border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 196, 120, 0.95) 0%, rgba(224, 140, 60, 0.45) 35%, rgba(13, 10, 20, 0) 70%);
        animation: sp-breathe 2.4s ease-in-out infinite;
      }
      #sp-loading .title { font-size: 30px; color: #f2c47a; font-style: normal; letter-spacing: 0.04em; }
      @keyframes sp-breathe { 0%, 100% { transform: scale(0.85); opacity: 0.7; } 50% { transform: scale(1.05); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #sp-loading .glow { animation: none; } }
    </style>
  </head>
  <body>
    <div id="sp-loading" role="status" aria-live="polite">
      <div class="glow"></div>
      <div class="title">Shadowplay</div>
      <div>Lighting the lamp…</div>
    </div>
    <div id="scene-container"></div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
